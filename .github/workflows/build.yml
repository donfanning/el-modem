name: source-preview
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      native_builds:
        description: Build and test native candidates (no binary publication)
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  linux-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 numba==0.61.2 textual==0.89.1
      - name: Source and settings tests without private fixtures or calls
        env:
          PYTHONPATH: lab/asterisk:lab/asterisk/audio-peer:packaging
          OPENBLAS_NUM_THREADS: '1'
        run: python -m unittest test_modem_desktop test_modem_portability test_serial_port test_sip_auth test_sip_uac test_sip_uas
  native-candidates:
    if: github.event_name == 'workflow_dispatch' && inputs.native_builds
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, target: linux-x86_64}
          - {os: windows-2022, target: windows-x86_64}
          - {os: macos-15-intel, target: macos-x86_64}
          - {os: macos-15, target: macos-arm64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '1'
      NUMBA_CACHE_DIR: ${{ github.workspace }}/build/numba-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 numba==0.61.2 pyinstaller==6.16.0 textual==0.89.1
      - name: Source desktop and portable worker checks
        shell: bash
        env:
          PYTHONPATH: lab/asterisk:lab/asterisk/audio-peer:packaging
        run: |
          export PYTHONPATH="$(python -c 'import os; print(os.pathsep.join(["lab/asterisk", "lab/asterisk/audio-peer", "packaging"]))')"
          python -m unittest test_modem_desktop test_modem_portability test_sip_auth test_sip_uac test_sip_uas
      - name: Build native single-file candidate
        run: python -m PyInstaller --noconfirm --distpath dist --workpath build/el-modem packaging/el_modem.spec
      - name: Frozen payload and AT gates
        shell: bash
        run: |
          exe=dist/el-modem
          if [ "$RUNNER_OS" = Windows ]; then exe=dist/el-modem.exe; fi
          mkdir -p candidate-reports
          python packaging/smoke.py "$exe" --report candidate-reports/reference.json
          python packaging/smoke_desktop.py "$exe" --report candidate-reports/desktop.json
          V34_NATIVE_TRELLIS=1 python packaging/smoke.py "$exe" --report candidate-reports/native.json
          python -m pip freeze > candidate-reports/build-dependencies.txt
      - name: Retain qualification reports only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-reports-${{ matrix.target }}
          path: candidate-reports/
          if-no-files-found: ignore
      # No binaries uploaded until provenance/notices review is complete.
