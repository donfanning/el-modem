name: source-preview
on: [push, pull_request]
jobs:
  linux-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy numba textual==0.89.1
      - name: Source and settings tests without private fixtures or calls
        env:
          PYTHONPATH: lab/asterisk:lab/asterisk/audio-peer:packaging
        run: python -m unittest test_modem_desktop test_serial_port test_sip_auth test_sip_uac test_sip_uas
