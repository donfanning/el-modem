name: source-preview
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      native_builds:
        description: Build and test native candidates (no binary publication)
        type: boolean
        default: true
      candidate_recipient:
        description: Optional age public recipient for encrypted local review archives
        type: string
        default: ''
      candidate_version:
        description: Experimental candidate version (for example 0.3.0-rc1)
        type: string
        default: '0.3.0-rc1'
permissions:
  contents: read
jobs:
  linux-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 numba==0.61.2 textual==0.89.1
      - name: Verify reviewed public source manifest
        run: |
          python packaging/public_manifest.py
          python -m unittest discover -s packaging -p test_public_manifest.py
          python -m unittest discover -s packaging -p test_python_component_notices.py
          python -m unittest discover -s packaging -p test_runtime_requirements.py
          python -m unittest discover -s packaging -p test_audit_windows_install.py
      - name: Reconstruct pinned MS-PL Windows driver sources (no WDK build)
        run: python packaging/windows-driver/prepare_source.py "$RUNNER_TEMP/el-modem-driver-source"
      - name: Source and settings tests without private fixtures or calls
        env:
          PYTHONPATH: lab/asterisk:lab/asterisk/audio-peer:packaging
          OPENBLAS_NUM_THREADS: '1'
        run: python -m unittest test_modem_desktop test_modem_com test_modem_pipe test_modem_symmetric_rtp test_modem_dce test_modem_portability test_serial_port test_iax_transport test_sip_auth test_sip_uac test_sip_uas
  driver-overlay:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reconstruct pinned MS-PL Windows driver sources under Git for Windows CRLF defaults
        shell: bash
        run: |
          git config --global core.autocrlf true
          python packaging/windows-driver/prepare_source.py "$RUNNER_TEMP/el-modem-driver-source"
  native-candidates:
    if: github.event_name == 'workflow_dispatch' && inputs.native_builds
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, target: linux-x86_64}
          - {os: windows-2022, target: windows-x86_64}
          - {os: macos-15-intel, target: macos-x86_64}
          - {os: macos-15, target: macos-arm64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '1'
      NUMBA_CACHE_DIR: ${{ github.workspace }}/build/numba-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install numpy==1.26.4 numba==0.61.2 pyinstaller==6.16.0 setuptools==70.3.0 textual==0.89.1 maturin==1.9.4
      - name: Set the macOS deployment floor for the IAX extension
        if: startsWith(matrix.target, 'macos-')
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "macos-x86_64" ]; then
            printf '%s\n' 'MACOSX_DEPLOYMENT_TARGET=10.15' 'RUSTFLAGS=-C link-arg=-mmacosx-version-min=10.15' >> "$GITHUB_ENV"
          else
            printf '%s\n' 'MACOSX_DEPLOYMENT_TARGET=11.0' 'RUSTFLAGS=-C link-arg=-mmacosx-version-min=11.0' >> "$GITHUB_ENV"
          fi
      - name: Build native IAX2 extension
        shell: bash
        run: |
          cargo test --locked --manifest-path native/iax/Cargo.toml
          maturin build --release --locked --manifest-path native/iax/Cargo.toml --interpreter python --out build/iax-wheel
          python -m pip install --no-deps build/iax-wheel/*.whl
      - name: Source desktop and portable worker checks
        shell: bash
        env:
          PYTHONPATH: lab/asterisk:lab/asterisk/audio-peer:packaging
        run: |
          PYTHONPATH="$(python -c 'import os; print(os.pathsep.join(["lab/asterisk", "lab/asterisk/audio-peer", "packaging"]))')"
          export PYTHONPATH
          # The complete DCE/media suite runs in linux-source. Its wall-clock
          # RTP loops are not a reliable hosted-runner gate on macOS/Windows
          # (and several tests use AF_UNIX datagram socketpairs unavailable on
          # Windows). Keep native-matrix checks focused on portable components;
          # each built executable still runs the frozen payload/AT gates below.
          python -m unittest test_modem_desktop test_modem_com test_modem_pipe test_modem_symmetric_rtp test_modem_portability test_serial_port test_iax_transport test_sip_auth test_sip_uac test_sip_uas
      - name: Build native single-file candidate
        run: python packaging/build_with_lineage.py --journal build/native-processing.jsonl --noconfirm --distpath dist --workpath build/el-modem packaging/el_modem.spec
      - name: Compile driver and no-driver installer layouts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
          python -m unittest discover -s packaging -p test_windows_installer_compile.py
          if ($LASTEXITCODE -ne 0) { throw 'Installer layout gate failed' }
      - name: Frozen payload and AT gates
        shell: bash
        run: |
          exe=dist/el-modem
          if [ "$RUNNER_OS" = Windows ]; then exe=dist/el-modem.exe; fi
          mkdir -p candidate-reports
          python packaging/smoke.py "$exe" --report candidate-reports/reference.json
          python packaging/smoke_desktop.py "$exe" --report candidate-reports/desktop.json
          V34_NATIVE_TRELLIS=1 python packaging/smoke.py "$exe" --report candidate-reports/native.json
          python -m pip freeze > candidate-reports/build-dependencies.txt
      - name: Install terminal emulator used by the packaged TUI harness
        if: startsWith(matrix.target, 'macos-')
        run: python -m pip install pyte==0.8.2
      - name: Packaged TUI and POSIX-device checks on macOS
        if: startsWith(matrix.target, 'macos-')
        run: python packaging/qualify_tui.py dist/el-modem candidate-reports/tui
      - name: Install minicom for macOS PTY qualification
        if: startsWith(matrix.target, 'macos-')
        run: brew install minicom
      - name: Qualify the current macOS candidate through minicom and its PTY
        if: startsWith(matrix.target, 'macos-')
        shell: bash
        run: |
          digest="$(shasum -a 256 dist/el-modem | awk '{print $1}')"
          python packaging/qualify_pty_terminal.py dist/el-modem \
            --target "${{ matrix.target }}" \
            --expected-sha256 "$digest" \
            --reports "candidate-reports/pty-${{ matrix.target }}"
      - name: Retain qualification reports only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-reports-${{ matrix.target }}
          path: candidate-reports/
          if-no-files-found: ignore
      - name: Inventory and assemble native review archive
        if: inputs.candidate_recipient != ''
        shell: bash
        env:
          CANDIDATE_RECIPIENT: ${{ inputs.candidate_recipient }}
          CANDIDATE_TARGET: ${{ matrix.target }}
          CANDIDATE_REVISION: ${{ github.sha }}
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
        run: |
          if [[ ! "$CANDIDATE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc[0-9]+$ ]]; then
            echo "Invalid experimental candidate version: $CANDIDATE_VERSION" >&2
            exit 2
          fi
          exe=dist/el-modem
          if [ "$RUNNER_OS" = Windows ]; then exe=dist/el-modem.exe; fi
          python packaging/inventory_portable.py "$exe" candidate-notices --lineage build/native-processing.jsonl
          python packaging/inventory_rust.py native/iax/Cargo.toml candidate-notices/rust
          python packaging/package_native_candidate.py "$exe" "build/el-modem-${CANDIDATE_VERSION}-${CANDIDATE_TARGET}.zip" --target "$CANDIDATE_TARGET" --version "$CANDIDATE_VERSION" --revision "$CANDIDATE_REVISION"
          python packaging/candidate_transport.py "build/el-modem-${CANDIDATE_VERSION}-${CANDIDATE_TARGET}.zip" "encrypted-candidates/el-modem-${CANDIDATE_VERSION}-${CANDIDATE_TARGET}.zip.age"
      - name: Windows installer (downloads the Microsoft runtime at install time)
        if: inputs.candidate_recipient != '' && runner.os == 'Windows'
        shell: pwsh
        env:
          CANDIDATE_RECIPIENT: ${{ inputs.candidate_recipient }}
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
        run: |
          if ($env:CANDIDATE_VERSION -notmatch '^\d+\.\d+\.\d+-rc\d+$') { throw "Invalid experimental candidate version: $env:CANDIDATE_VERSION" }
          ./packaging/windows/build_installer.ps1 -Archive "build/el-modem-$env:CANDIDATE_VERSION-windows-x86_64.zip" -Version $env:CANDIDATE_VERSION -Out build/installer
          $setup = (Get-ChildItem build/installer -Filter '*-setup.exe').FullName
          python packaging/candidate_transport.py $setup "encrypted-candidates/el-modem-$env:CANDIDATE_VERSION-windows-x86_64-setup.exe.age"
      - name: Retain encrypted candidates only
        if: inputs.candidate_recipient != '' && success()
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-candidate-${{ matrix.target }}
          path: encrypted-candidates/
          if-no-files-found: error
          retention-days: 3
      # No plaintext binaries uploaded while review is open. Private identity stays local.
